<!-- STICKY HEADER -->
<div style="position: sticky; top: 0; background: #fff; z-index: 10; padding: 12px 16px; border-bottom: 1px solid #f0f0f0;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <i class="fa-solid fa-arrow-left" onclick="history.back()" style="font-size: 18px; cursor: pointer; color: #333;"></i>
    <div style="flex: 1; position: relative;" onclick="history.back()">
      <div style="width: 100%; padding: 12px 40px 12px 16px; border-radius: 8px; border: 1px solid #e0e0e0; font-size: 15px; background: #f8f8f8; color: #333;" id="results-search-label">Search</div>
      <i class="fa-solid fa-magnifying-glass" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #888;"></i>
    </div>
  </div>
</div>

<!-- ACTIVE FILTER PILLS (Shows what is selected) -->
<div id="active-filters-bar" style="display:none; gap: 8px; overflow-x: auto; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; background: #fff; align-items: center;">
  <!-- Populated by JS -->
</div>

<!-- FILTER CHIPS -->
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; scrollbar-width: none;">
  <button onclick="openFilterSheet()" style="display:flex; align-items:center; gap:6px; padding: 8px 12px; border-radius: 8px; border: 1px solid #111; background: #111; color: #fff; font-size: 13px; font-weight: 500; white-space: nowrap;">
    <i class="fa-solid fa-sliders"></i> Filter & Sort <span id="active-filter-count" style="background:#FF4B2B; border-radius:50%; width:16px; height:16px; display:none; align-items:center; justify-content:center; font-size:10px;">0</span>
  </button>
</div>

<!-- RESULTS GRID -->
<div id="final-results-grid" class="grid" style="padding: 16px; padding-bottom: 80px; background: #f9f9f9;"></div>

<!-- FILTER BOTTOM SHEET (AMAZON STYLE) -->
<div id="filter-overlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; opacity: 0; transition: opacity 0.3s;" onclick="closeFilterSheet()"></div>

<div id="filter-sheet" style="position: fixed; bottom: -100%; left: 0; right: 0; background: #fff; z-index: 1000; transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); height: 90vh; display: flex; flex-direction: column;">
  <!-- Header -->
  <div style="padding: 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
    <h2 style="font-size: 18px; font-weight: 700; color: #111;">Filters</h2>
    <i class="fa-solid fa-xmark" onclick="closeFilterSheet()" style="font-size: 20px; cursor: pointer; color: #666;"></i>
  </div>

  <!-- Scrollable Content -->
  <div id="filter-accordion-container" style="flex: 1; overflow-y: auto; padding: 0 16px;"></div>

  <!-- Sticky Apply Button -->
  <div style="padding: 16px; border-top: 1px solid #eee; background: #fff; display: flex; gap: 12px;">
    <button onclick="resetFilters()" style="flex: 1; padding: 16px; background: #fff; color: #111; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; font-weight: 600;">Clear All</button>
    <button onclick="applyFilters()" style="flex: 2; padding: 16px; background: #111; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold;">Apply</button>
  </div>
</div>
