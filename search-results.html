<!-- STICKY HEADER -->
<div style="position: sticky; top: 0; background: #fff; z-index: 10; padding: 12px 16px; border-bottom: 1px solid #f0f0f0;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <i class="fa-solid fa-arrow-left" onclick="history.back()" style="font-size: 18px; cursor: pointer; color: #333;"></i>
    <div style="flex: 1; position: relative;" onclick="history.back()">
      <div style="width: 100%; padding: 12px 40px 12px 16px; border-radius: 8px; border: 1px solid #e0e0e0; font-size: 15px; background: #f8f8f8; color: #333;" id="results-search-label">
        Search
      </div>
      <i class="fa-solid fa-magnifying-glass" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #888;"></i>
    </div>
    <i class="fa-regular fa-heart" style="font-size: 20px; color: #333; cursor: pointer;"></i>
  </div>
</div>

<!-- FILTER CHIPS -->
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; scrollbar-width: none;">
  <button style="display:flex; align-items:center; gap:6px; padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 13px; font-weight: 500; white-space: nowrap;">
    <i class="fa-solid fa-sliders"></i> Filter & Sort
  </button>
  <button style="padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 13px; font-weight: 500; white-space: nowrap; display:flex; align-items:center; gap:6px;">Category <i class="fa-solid fa-caret-down"></i></button>
  <button style="padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 13px; font-weight: 500; white-space: nowrap; display:flex; align-items:center; gap:6px;">Brand <i class="fa-solid fa-caret-down"></i></button>
  <button style="padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 13px; font-weight: 500; white-space: nowrap; display:flex; align-items:center; gap:6px;">Price <i class="fa-solid fa-caret-down"></i></button>
</div>

<!-- RESULTS GRID -->
<div id="final-results-grid" class="grid" style="padding: 16px; padding-bottom: 80px; background: #f9f9f9;">
  <!-- Products injected by JS -->
</div>
