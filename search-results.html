<!-- STICKY HEADER -->
<div style="position: sticky; top: 0; background: #fff; z-index: 10; padding: 12px 16px; border-bottom: 1px solid #f0f0f0;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <i class="fa-solid fa-arrow-left" onclick="history.back()" style="font-size: 18px; cursor: pointer; color: #333;"></i>
    <div style="flex: 1; position: relative;" onclick="history.back()">
      <div style="width: 100%; padding: 12px 40px 12px 16px; border-radius: 8px; border: 1px solid #e0e0e0; font-size: 15px; background: #f8f8f8; color: #333;" id="results-search-label">
        Search
      </div>
      <i class="fa-solid fa-magnifying-glass" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #888;"></i>
    </div>
  </div>
</div>

<!-- FILTER CHIPS -->
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; scrollbar-width: none;">
  <!-- Triggers the bottom sheet -->
  <button onclick="openFilterSheet()" style="display:flex; align-items:center; gap:6px; padding: 8px 12px; border-radius: 8px; border: 1px solid #111; background: #111; color: #fff; font-size: 13px; font-weight: 500; white-space: nowrap;">
    <i class="fa-solid fa-sliders"></i> Filter & Sort
  </button>
  <button onclick="showToast('Category filters coming soon')" style="padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 13px; font-weight: 500; white-space: nowrap; display:flex; align-items:center; gap:6px;">Category <i class="fa-solid fa-caret-down"></i></button>
  <button onclick="showToast('Brand filters coming soon')" style="padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 13px; font-weight: 500; white-space: nowrap; display:flex; align-items:center; gap:6px;">Brand <i class="fa-solid fa-caret-down"></i></button>
</div>

<!-- RESULTS GRID -->
<div id="final-results-grid" class="grid" style="padding: 16px; padding-bottom: 80px; background: #f9f9f9;">
  <!-- Products injected by JS -->
</div>

<!-- FILTER BOTTOM SHEET (HIDDEN BY DEFAULT) -->
<div id="filter-overlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; opacity: 0; transition: opacity 0.3s;" onclick="closeFilterSheet()"></div>

<div id="filter-sheet" style="position: fixed; bottom: -100%; left: 0; right: 0; background: #fff; border-radius: 24px 24px 0 0; z-index: 1000; padding: 24px 16px; transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
  <div style="width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px;"></div>
  <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Sort by</h2>
  
  <div onclick="sortProducts('relevance')" style="padding: 16px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; cursor: pointer;">
    <span>Relevance</span>
    <i class="fa-solid fa-check" id="check-relevance" style="color: #008C4A;"></i>
  </div>
  <div onclick="sortProducts('price-low')" style="padding: 16px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; cursor: pointer;">
    <span>Price: Low to High</span>
    <i class="fa-solid fa-check" id="check-price-low" style="color: #008C4A; display: none;"></i>
  </div>
  <div onclick="sortProducts('price-high')" style="padding: 16px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; cursor: pointer;">
    <span>Price: High to Low</span>
    <i class="fa-solid fa-check" id="check-price-high" style="color: #008C4A; display: none;"></i>
  </div>
  
  <button onclick="closeFilterSheet()" style="width: 100%; padding: 16px; background: #111; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; margin-top: 24px;">Apply</button>
</div>
