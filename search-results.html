<!-- STICKY HEADER -->
<div style="position: sticky; top: 0; background: #fff; z-index: 10; padding: 12px 16px; border-bottom: 1px solid #f0f0f0;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <i class="fa-solid fa-arrow-left" onclick="history.back()" style="font-size: 18px; cursor: pointer; color: #333;"></i>
    <div style="flex: 1; position: relative;" onclick="history.back()">
      <div style="width: 100%; padding: 12px 40px 12px 16px; border-radius: 8px; border: 1px solid #e0e0e0; font-size: 15px; background: #f8f8f8; color: #333;" id="results-search-label">Search</div>
      <i class="fa-solid fa-magnifying-glass" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #888;"></i>
    </div>
  </div>
</div>

<!-- ACTIVE FILTER PILLS -->
<div id="active-filters-container" style="display: none; gap: 8px; overflow-x: auto; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; background: #fff; align-items: center; scrollbar-width: none;"></div>

<!-- FILTER CHIPS -->
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; scrollbar-width: none;">
  <button onclick="openFilterSheet()" style="display:flex; align-items:center; gap:6px; padding: 8px 12px; border-radius: 8px; border: 1px solid #111; background: #111; color: #fff; font-size: 13px; font-weight: 500; white-space: nowrap;">
    <i class="fa-solid fa-sliders"></i> Filter & Sort <span id="active-filter-count" style="background:#FF4B2B; border-radius:50%; width:16px; height:16px; display:none; align-items:center; justify-content:center; font-size:10px;">0</span>
  </button>
</div>

<!-- RESULTS GRID -->
<div id="final-results-grid" class="grid" style="padding: 16px; background: #f9f9f9;"></div>

<!-- PAGINATION -->
<div id="pagination-controls" style="display: none; justify-content: center; gap: 16px; padding: 0 16px 100px; background: #f9f9f9;">
  <button onclick="changePage(-1)" id="prev-btn" style="padding: 12px 24px; background: #fff; border: 1px solid #ddd; border-radius: 8px; font-weight: 600;">Previous</button>
  <span id="page-indicator" style="display: flex; align-items: center; font-weight: 600; color: #333;">Page 1</span>
  <button onclick="changePage(1)" id="next-btn" style="padding: 12px 24px; background: #111; color: #fff; border: none; border-radius: 8px; font-weight: 600;">Next</button>
</div>

<!-- OVERLAY -->
<div id="filter-overlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; opacity: 0; transition: opacity 0.3s;" onclick="closeFilterSheet()"></div>

<!-- THE NEW FILTER SHEET -->
<div id="filter-sheet">
  <div class="filter-sheet-header" style="padding: 16px; display: flex; justify-content: space-between; align-items: center;">
    <div><h2 style="font-size: 20px; font-weight: 700; color: #111; margin: 0; display:inline;">Filters</h2><span onclick="resetDraftFilters()" style="margin-left: 16px; font-size: 14px; color: #FF4B2B; font-weight: 600; cursor: pointer;">Clear All</span></div>
    <div onclick="closeFilterSheet()" style="padding: 8px; cursor: pointer;"><i class="fa-solid fa-xmark" style="font-size: 24px; color: #333;"></i></div>
  </div>
  <div style="padding: 12px 16px;">
    <div style="position: relative;">
      <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #888;"></i>
      <input type="text" id="filter-search-input" placeholder="Search filters and brands" oninput="executeFilterSearch()" style="width: 100%; padding: 14px 14px 14px 44px; border-radius: 12px; border: 1px solid #ddd; font-size: 15px; outline: none; background: #fafafa;">
    </div>
  </div>
  <div style="flex: 1; display: flex; overflow: hidden; border-top: 1px solid #eee;">
    <div id="filter-sidebar" style="width: 35%; background: #f9f9f9; overflow-y: auto; border-right: 1px solid #eee;"></div>
    <div id="filter-content" style="width: 65%; padding: 16px; overflow-y: auto;"></div>
  </div>
  <div style="padding: 16px; border-top: 1px solid #eee; background: #fff; display: flex; justify-content: flex-end; padding-bottom: calc(16px + env(safe-area-inset-bottom));">
    <button onclick="applyFilters()" style="padding: 14px 28px; background: #FFD814; color: #111; border: 1px solid #FCD200; border-radius: 24px; font-size: 16px; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">Show <span id="filter-result-count">0</span> results</button>
  </div>
</div>
