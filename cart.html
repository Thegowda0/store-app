<h2 style="padding:16px; font-size:20px; font-weight:700;">Your Cart</h2>

<div id="cart-items" style="background:#fff; border-radius:16px; margin:0 16px; overflow:hidden;"></div>

<div id="cart-summary" style="display:none; padding:16px;">
  <div style="display:flex; justify-content:space-between; margin-bottom:16px; font-size:18px; font-weight:700;">
    <span>Total</span>
    <span id="cart-total">$0.00</span>
  </div>
  <button onclick="checkout()" style="width:100%; padding:16px; background:#111; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:bold;">
    Proceed to Checkout
  </button>
</div>
