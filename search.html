<div style="background: #fff; min-height: 100vh;">
  <div style="position: sticky; top: 0; background: #fff; z-index: 10; padding: 12px 16px; border-bottom: 1px solid #f0f0f0;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <i class="fa-solid fa-arrow-left" onclick="history.back()" style="font-size: 18px; cursor: pointer; color: #333;"></i>
      <div style="flex: 1; position: relative;">
        <input type="text" id="search-page-input" placeholder="Search for products..." oninput="executeSearch()" onkeydown="if(event.key === 'Enter') saveSearchHistory(this.value)" autocomplete="off" style="width: 100%; padding: 12px 40px 12px 16px; border-radius: 8px; border: 1px solid #e0e0e0; font-size: 15px; outline: none; background: #f8f8f8;">
        <i class="fa-solid fa-magnifying-glass" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #888;"></i>
      </div>
    </div>
  </div>

  <div id="default-search-state" style="padding: 16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
      <h3 style="font-size: 16px; font-weight: 700; color: #111;">Recent Searches</h3>
      <span onclick="clearRecent()" style="font-size: 13px; color: #FF4B2B; font-weight: 600; cursor: pointer;">Clear</span>
    </div>
    <div id="recent-searches" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
    <h3 style="font-size: 16px; font-weight: 700; color: #111; margin-top: 32px; margin-bottom: 16px;">Trending Products</h3>
    <div class="grid" id="trending-search"></div>
  </div>

  <div id="active-search-state" style="display: none;">
    <div style="padding: 12px 16px 0; text-align: right;">
      <span onclick="goToSearchResults()" style="font-size: 13px; color: #111; font-weight: 600; cursor: pointer;">See all results <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i></span>
    </div>
    <div id="autocomplete-list" style="padding: 16px;"></div>
  </div>
</div>
