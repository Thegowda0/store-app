<!-- SEARCH HEADER -->
<div style="position: sticky; top: 0; background: #f7f7f7; z-index: 10; padding: 16px;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <i class="fa-solid fa-arrow-left" onclick="history.back()" style="font-size: 20px; cursor: pointer; padding: 8px;"></i>
    <div style="flex: 1; position: relative;">
      <input type="text" id="search-page-input" placeholder="Search..." oninput="executeSearch()" autofocus
        style="width: 100%; padding: 12px 16px; border-radius: 12px; border: none; font-size: 15px; outline: none; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
      <i class="fa-solid fa-magnifying-glass" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #888;"></i>
    </div>
  </div>

  <!-- CATEGORY PILLS -->
  <div id="search-categories" style="display: flex; gap: 8px; overflow-x: auto; margin-top: 16px; padding-bottom: 4px; scrollbar-width: none;">
    <!-- Populated by JS -->
  </div>
</div>

<!-- SEARCH RESULTS -->
<div id="search-results" class="grid" style="margin-top: 8px; padding-bottom: 32px;">
  <!-- Populated by JS -->
</div>
